services:
  - type: web
    name: axiom
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Run the project's bootstrap which applies migrations, then start Gunicorn.
    # This avoids using Render preDeployCommand (not available on Free plan)
    startCommand: python3 backend/bootstrap_postgres.py && gunicorn backend.app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: axiom-db
          property: connectionString

databases:
  - name: axiom-db
    plan: free
